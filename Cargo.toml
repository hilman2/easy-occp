[package]
name = "easy-occp"
version = "0.3.1"
edition = "2021"
rust-version = "1.80"
description = "Einfaches Management-Tool für Wallboxen (OCPP 1.5/1.6/2.0.1) für KMUs"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rand = "0.8"
askama = "0.12"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
dashmap = "6"
printpdf = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
